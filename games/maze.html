<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="../favicon.png">
<title>迷宮尋路 — 演算法互動遊戲集</title>
<link rel="stylesheet" href="../shared/style.css">
<style>
  .maze-wrap{display:flex;justify-content:center;margin:16px 0;overflow-x:auto;}
  canvas#maze-canvas{border:2px solid var(--border);border-radius:8px;display:block;}

  .algo-tabs{display:flex;gap:8px;justify-content:center;margin:12px 0;flex-wrap:wrap;}
  .algo-tab{padding:8px 18px;border-radius:8px;border:2px solid var(--border);background:var(--surface);
    color:var(--text-dim);font-size:12px;font-weight:700;cursor:pointer;transition:all 0.2s;font-family:'Orbitron',monospace;}
  .algo-tab:hover:not(:disabled){border-color:var(--accent);}
  .algo-tab:disabled{opacity:0.3;cursor:not-allowed;}
  .algo-tab.active-bfs{border-color:#00e5ff;color:#00e5ff;background:rgba(0,229,255,0.08);}
  .algo-tab.active-dfs{border-color:#ea80fc;color:#ea80fc;background:rgba(234,128,252,0.08);}
  .algo-tab.active-player{border-color:var(--accent3);color:var(--accent3);background:rgba(105,255,71,0.08);}

  .stats-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0;}
  .stat-box{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 16px;text-align:center;min-width:100px;}
  .stat-val{font-family:'Orbitron',monospace;font-size:20px;font-weight:900;}
  .stat-lbl{font-size:10px;color:var(--text-dim);margin-top:3px;}

  .dir-btns{display:grid;grid-template-columns:repeat(3,52px);gap:6px;justify-content:center;margin:12px 0;}
  .dir-btn{width:52px;height:52px;border-radius:10px;border:2px solid var(--border);background:var(--surface);
    font-size:20px;cursor:pointer;transition:all 0.18s;display:flex;align-items:center;justify-content:center;}
  .dir-btn:hover:not(:disabled){border-color:var(--accent3);background:rgba(105,255,71,0.08);}
  .dir-btn:disabled{opacity:0.2;cursor:not-allowed;}

  .speed-row{display:flex;align-items:center;gap:10px;justify-content:center;margin:8px 0;}
  .speed-lbl{font-size:11px;color:var(--text-dim);}
</style>
</head>
<body>
<canvas id="confetti-canvas"></canvas>
<div class="container">

<header>
  <div class="title">
    <img src="../assets/icons/BFS-DFS.png" style="height:50px;vertical-align:middle;margin-right:8px;" onerror="this.style.display='none'">
    迷宮尋路
  </div>
  <div class="subtitle">BFS · DFS · 最短路徑視覺化</div>
</header>

<div style="text-align:center;margin-bottom:20px">
  <a href="../index.html" style="font-size:12px;color:var(--text-dim);text-decoration:none;letter-spacing:0.1em;text-transform:uppercase;padding:8px 14px;border:1px solid var(--border);border-radius:8px;transition:all 0.2s;display:inline-block;"
    onmouseover="this.style.color='var(--accent)';this.style.borderColor='var(--accent)'"
    onmouseout="this.style.color='var(--text-dim)';this.style.borderColor='var(--border)'">← 返回選單</a>
</div>

<div class="rules-block">
  <div class="rules-title">📖 遊戲說明</div>
  <div class="rules-body">
    <div class="rules-item move">
      <div class="ri-label">第一步</div>
      <div class="ri-text">先<strong>自己走迷宮</strong>，從綠色 S 出發，到達紅色 E 終點</div>
    </div>
    <div class="rules-item win">
      <div class="ri-label">第二步</div>
      <div class="ri-text">走完後解鎖 <strong>BFS</strong> 和 <strong>DFS</strong> 按鈕，觀看各自怎麼找路</div>
    </div>
    <div class="rules-item tip">
      <div class="ri-label">挑戰</div>
      <div class="ri-text">你走的步數能和 BFS 最短路徑一樣少嗎？👇</div>
    </div>
  </div>
</div>

<!-- 設定 -->
<div class="panel active" id="panel-setup">
  <div class="panel-title">⚙️ 迷宮設定</div>
  <div class="input-group"><label>迷宮大小</label>
    <select id="maze-size">
      <option value="9">9×9（入門）</option>
      <option value="13" selected>13×13（經典）</option>
      <option value="17">17×17（挑戰）</option>
    </select></div>
  <div class="btn-row">
    <button class="btn btn-primary btn-lg" onclick="mazeBegin()">🚀 開始</button>
  </div>
</div>

<!-- 遊戲 -->
<div class="panel" id="panel-game">
  <div class="panel-title">🌀 迷宮尋路</div>

  <div class="stats-row">
    <div class="stat-box">
      <div class="stat-val" id="stat-player" style="color:var(--accent3);">0</div>
      <div class="stat-lbl">你的步數</div>
    </div>
    <div class="stat-box">
      <div class="stat-val" id="stat-bfs" style="color:#00e5ff;">—</div>
      <div class="stat-lbl">BFS 最短步數</div>
    </div>
    <div class="stat-box">
      <div class="stat-val" id="stat-dfs" style="color:#ea80fc;">—</div>
      <div class="stat-lbl">DFS 探索格數</div>
    </div>
  </div>

  <div class="maze-wrap">
    <canvas id="maze-canvas"></canvas>
  </div>

  <div class="algo-tabs">
    <button class="algo-tab active-player" id="tab-player" onclick="setView('player')">🟢 自己走</button>
    <button class="algo-tab" id="tab-bfs" onclick="setView('bfs')" disabled>🔵 BFS</button>
    <button class="algo-tab" id="tab-dfs" onclick="setView('dfs')" disabled>🟣 DFS</button>
  </div>

  <!-- 方向按鈕 -->
  <div id="dir-area">
    <div class="dir-btns">
      <div></div>
      <button class="dir-btn" onclick="playerMove(0,-1)">↑</button>
      <div></div>
      <button class="dir-btn" onclick="playerMove(-1,0)">←</button>
      <button class="dir-btn" onclick="mazeBegin()">↺</button>
      <button class="dir-btn" onclick="playerMove(1,0)">→</button>
      <div></div>
      <button class="dir-btn" onclick="playerMove(0,1)">↓</button>
      <div></div>
    </div>
    <div style="font-size:11px;color:var(--text-dim);text-align:center;">也可以用鍵盤方向鍵或 WASD</div>
  </div>

  <!-- 演算法控制 -->
  <div id="algo-area" style="display:none;">
    <div class="speed-row">
      <span class="speed-lbl">速度</span>
      <input type="range" id="algo-speed" min="1" max="5" value="3" style="width:120px;">
      <span class="speed-lbl" id="speed-label">中</span>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="algo-run-btn" onclick="algoRun()">▶ 執行</button>
      <button class="btn btn-sm" onclick="algoReset()">↺ 重置</button>
    </div>
    <div class="status-bar" style="margin-top:8px;">
      <div class="status-dot" id="algo-dot"></div>
      <div style="flex:1"><div class="status-text" id="algo-status">點擊執行開始</div></div>
    </div>
  </div>

  <!-- 走完後的提示 -->
  <div id="finish-msg" style="display:none;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 16px;margin:10px 0;font-size:13px;color:var(--text-dim);text-align:center;"></div>

  <div class="btn-row" style="margin-top:14px;">
    <button class="btn btn-sm" onclick="goHome()">⚙️ 重新設定</button>
    <button class="btn btn-sm" onclick="mazeBegin()">🎲 新迷宮</button>
  </div>
</div>

<!-- 演算法解析連結 -->
<div style="text-align:center;margin:24px 0 8px;">
  <a href="maze-algo.html"
    style="display:inline-flex;align-items:center;gap:10px;padding:14px 28px;
      background:var(--surface);border:1px solid var(--border);border-radius:12px;
      text-decoration:none;color:var(--text);font-size:14px;transition:all 0.2s;letter-spacing:0.03em;"
    onmouseover="this.style.borderColor='var(--accent)';this.style.color='var(--accent)'"
    onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--text)'">
    🧠 <strong>看演算法解析</strong> &nbsp;— BFS vs DFS · 最短路徑 · 時間空間複雜度
  </a>
</div>

</div>

<script src="../shared/firebase.js"></script>
<script src="../shared/ui.js"></script>
<script>
const WALL=1,PATH=0;
let MZ={
  grid:[],rows:0,cols:0,cellSize:32,
  player:{x:1,y:1},
  playerPath:[[1,1]],playerSteps:0,
  bfsResult:null,dfsResult:null,
  view:'player',done:false,
  algoRunning:false
};

function goHome(){
  MZ.algoRunning=false;
  showPanel('panel-setup');
}

function mazeBegin(){
  MZ.algoRunning=false;
  const sz=+document.getElementById('maze-size').value;
  MZ.rows=sz;MZ.cols=sz;
  MZ.grid=generateMaze(sz,sz);
  MZ.player={x:1,y:1};
  MZ.playerPath=[[1,1]];
  MZ.playerSteps=0;
  MZ.view='player';
  MZ.done=false;

  MZ.bfsResult=runBFS(MZ.grid,MZ.rows,MZ.cols);
  MZ.dfsResult=runDFS(MZ.grid,MZ.rows,MZ.cols);

  document.getElementById('stat-player').textContent='0';
  document.getElementById('stat-bfs').textContent=MZ.bfsResult.path.length>0?MZ.bfsResult.path.length-1:'?';
  document.getElementById('stat-dfs').textContent=MZ.dfsResult.visited.length;
  document.getElementById('tab-bfs').disabled=true;
  document.getElementById('tab-dfs').disabled=true;
  document.getElementById('tab-bfs').className='algo-tab';
  document.getElementById('tab-dfs').className='algo-tab';
  document.getElementById('tab-player').className='algo-tab active-player';
  document.getElementById('dir-area').style.display='';
  document.getElementById('algo-area').style.display='none';
  document.getElementById('finish-msg').style.display='none';

  setupCanvas();
  drawMaze();
  showPanel('panel-game');
}

// 用 DFS 遞迴生成迷宮（奇數格為通道）
function generateMaze(rows,cols){
  const grid=Array.from({length:rows},()=>Array(cols).fill(WALL));
  function carve(x,y){
    grid[y][x]=PATH;
    const dirs=[[0,-2],[0,2],[-2,0],[2,0]].sort(()=>Math.random()-0.5);
    for(const[dx,dy]of dirs){
      const nx=x+dx,ny=y+dy;
      if(nx>0&&nx<cols-1&&ny>0&&ny<rows-1&&grid[ny][nx]===WALL){
        grid[y+dy/2][x+dx/2]=PATH;
        carve(nx,ny);
      }
    }
  }
  carve(1,1);
  // 確保終點可達
  grid[rows-2][cols-2]=PATH;
  // 確保終點周邊至少一格可走
  if(grid[rows-2][cols-3]===WALL&&grid[rows-3][cols-2]===WALL){
    grid[rows-2][cols-3]=PATH;
  }
  return grid;
}

function runBFS(grid,rows,cols){
  const endX=cols-2,endY=rows-2;
  const queue=[[1,1,[]]];
  const visited=new Set(['1,1']);
  const cellOrder=[];
  while(queue.length){
    const[x,y,path]=queue.shift();
    cellOrder.push([x,y]);
    if(x===endX&&y===endY)return{path:[...path,[x,y]],visited:cellOrder};
    for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=x+dx,ny=y+dy,key=`${nx},${ny}`;
      if(nx>=0&&nx<cols&&ny>=0&&ny<rows&&grid[ny][nx]===PATH&&!visited.has(key)){
        visited.add(key);
        queue.push([nx,ny,[...path,[x,y]]]);
      }
    }
  }
  return{path:[],visited:cellOrder};
}

function runDFS(grid,rows,cols){
  const endX=cols-2,endY=rows-2;
  const stack=[[1,1,[]]];
  const visited=new Set(['1,1']);
  const cellOrder=[];
  while(stack.length){
    const[x,y,path]=stack.pop();
    cellOrder.push([x,y]);
    if(x===endX&&y===endY)return{path:[...path,[x,y]],visited:cellOrder};
    for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=x+dx,ny=y+dy,key=`${nx},${ny}`;
      if(nx>=0&&nx<cols&&ny>=0&&ny<rows&&grid[ny][nx]===PATH&&!visited.has(key)){
        visited.add(key);
        stack.push([nx,ny,[...path,[x,y]]]);
      }
    }
  }
  return{path:[],visited:cellOrder};
}

function setupCanvas(){
  const canvas=document.getElementById('maze-canvas');
  const maxW=Math.min(window.innerWidth-48,500);
  MZ.cellSize=Math.max(Math.floor(maxW/MZ.cols),14);
  canvas.width=MZ.cols*MZ.cellSize;
  canvas.height=MZ.rows*MZ.cellSize;
}

function drawMaze(visitedCells,pathCells,mode){
  const canvas=document.getElementById('maze-canvas');
  const ctx=canvas.getContext('2d');
  const cs=MZ.cellSize;
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // 底層格子
  for(let y=0;y<MZ.rows;y++){
    for(let x=0;x<MZ.cols;x++){
      ctx.fillStyle=MZ.grid[y][x]===WALL?'#111122':'#1e1e2e';
      ctx.fillRect(x*cs,y*cs,cs,cs);
    }
  }

  // 玩家走過的路徑（自己走模式）
  if(MZ.view==='player'&&MZ.playerPath.length>1){
    ctx.strokeStyle='rgba(105,255,71,0.4)';
    ctx.lineWidth=Math.max(cs*0.25,2);
    ctx.lineCap='round';ctx.lineJoin='round';
    ctx.beginPath();
    MZ.playerPath.forEach(([x,y],i)=>{
      i===0?ctx.moveTo(x*cs+cs/2,y*cs+cs/2):ctx.lineTo(x*cs+cs/2,y*cs+cs/2);
    });
    ctx.stroke();
  }

  // 演算法探索的格子
  if(visitedCells&&visitedCells.length>0){
    const col=mode==='bfs'?'rgba(0,229,255,0.18)':'rgba(234,128,252,0.18)';
    for(const[x,y]of visitedCells){
      ctx.fillStyle=col;
      ctx.fillRect(x*cs+1,y*cs+1,cs-2,cs-2);
    }
  }

  // 演算法路徑
  if(pathCells&&pathCells.length>1){
    ctx.strokeStyle=mode==='bfs'?'#00e5ff':'#ea80fc';
    ctx.lineWidth=Math.max(cs*0.3,3);
    ctx.lineCap='round';ctx.lineJoin='round';
    ctx.beginPath();
    pathCells.forEach(([x,y],i)=>{
      i===0?ctx.moveTo(x*cs+cs/2,y*cs+cs/2):ctx.lineTo(x*cs+cs/2,y*cs+cs/2);
    });
    ctx.stroke();
  }

  // 起點
  const sx=1,sy=1;
  ctx.fillStyle='#69ff47';
  ctx.beginPath();ctx.arc(sx*cs+cs/2,sy*cs+cs/2,cs*0.38,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#000';ctx.font=`bold ${Math.max(cs*0.42,10)}px sans-serif`;
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('S',sx*cs+cs/2,sy*cs+cs/2);

  // 終點
  const ex=MZ.cols-2,ey=MZ.rows-2;
  ctx.fillStyle='#ff4081';
  ctx.beginPath();ctx.arc(ex*cs+cs/2,ey*cs+cs/2,cs*0.38,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.font=`bold ${Math.max(cs*0.42,10)}px sans-serif`;
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('E',ex*cs+cs/2,ey*cs+cs/2);

  // 玩家位置（未完成時顯示）
  if(MZ.view==='player'&&!MZ.done){
    const{x,y}=MZ.player;
    if(!(x===1&&y===1)){// 不在起點才畫，避免遮住 S
      ctx.fillStyle='rgba(105,255,71,0.9)';
      ctx.beginPath();ctx.arc(x*cs+cs/2,y*cs+cs/2,cs*0.28,0,Math.PI*2);ctx.fill();
    }
  }
}

function setView(v){
  MZ.algoRunning=false;
  MZ.view=v;
  ['player','bfs','dfs'].forEach(t=>{
    const el=document.getElementById('tab-'+t);
    if(el&&!el.disabled)el.className='algo-tab'+(t===v?` active-${t}`:'');
  });
  document.getElementById('tab-player').className='algo-tab'+(v==='player'?' active-player':'');
  document.getElementById('dir-area').style.display=v==='player'?'':'none';
  document.getElementById('algo-area').style.display=v!=='player'?'':'none';
  document.getElementById('algo-run-btn').disabled=false;
  document.getElementById('algo-status').textContent='點擊執行開始';
  setStatusDot('algo-dot','waiting');
  drawMaze([],null,v);
}

function playerMove(dx,dy){
  if(MZ.done||MZ.view!=='player')return;
  const nx=MZ.player.x+dx,ny=MZ.player.y+dy;
  if(nx<0||nx>=MZ.cols||ny<0||ny>=MZ.rows)return;
  if(MZ.grid[ny][nx]===WALL)return;
  MZ.player={x:nx,y:ny};
  MZ.playerPath.push([nx,ny]);
  MZ.playerSteps++;
  document.getElementById('stat-player').textContent=MZ.playerSteps;
  drawMaze();

  // 到達終點
  if(nx===MZ.cols-2&&ny===MZ.rows-2){
    MZ.done=true;
    const bfsLen=MZ.bfsResult.path.length>0?MZ.bfsResult.path.length-1:0;
    const diff=MZ.playerSteps-bfsLen;

    document.getElementById('tab-bfs').disabled=false;
    document.getElementById('tab-dfs').disabled=false;
    document.getElementById('tab-bfs').className='algo-tab';
    document.getElementById('tab-dfs').className='algo-tab';

    const finishEl=document.getElementById('finish-msg');
    finishEl.style.display='';
    finishEl.textContent=diff===0
      ?`🎉 完美！你走了最短路徑 ${MZ.playerSteps} 步，和 BFS 一樣！點 BFS / DFS 看看演算法怎麼走。`
      :diff<=3
      ?`👍 不錯！你走了 ${MZ.playerSteps} 步，BFS 最短是 ${bfsLen} 步，差了 ${diff} 步。點 BFS 看最短路！`
      :`💡 你走了 ${MZ.playerSteps} 步，BFS 最短是 ${bfsLen} 步，差了 ${diff} 步。看看 BFS 怎麼找最短路？`;

    document.getElementById('dir-area').style.display='none';
    if(diff===0)launchConfetti();
  }
}

async function algoRun(){
  if(MZ.algoRunning)return;
  MZ.algoRunning=true;
  document.getElementById('algo-run-btn').disabled=true;
  const mode=MZ.view;
  const result=mode==='bfs'?MZ.bfsResult:MZ.dfsResult;
  const speedMap={1:150,2:80,3:30,4:10,5:2};
  const delay=speedMap[+document.getElementById('algo-speed').value]||30;
  setStatusDot('algo-dot','your-turn');

  const visited=[];
  for(let i=0;i<result.visited.length;i++){
    if(!MZ.algoRunning)break;
    visited.push(result.visited[i]);
    document.getElementById('algo-status').textContent=
      `${mode.toUpperCase()} 探索中… 已訪問 ${visited.length} 格`;
    drawMaze(visited,null,mode);
    await sleep(delay);
  }

  if(MZ.algoRunning){
    drawMaze(visited,result.path,mode);
    const pathLen=result.path.length>0?result.path.length-1:0;
    document.getElementById('algo-status').textContent=
      mode==='bfs'
        ?`BFS 完成！最短路徑 ${pathLen} 步，共探索 ${result.visited.length} 格`
        :`DFS 完成！找到路徑 ${pathLen} 步，共探索 ${result.visited.length} 格`;
    setStatusDot('algo-dot','over');
  }
  MZ.algoRunning=false;
  document.getElementById('algo-run-btn').disabled=false;
}

function algoReset(){
  MZ.algoRunning=false;
  document.getElementById('algo-run-btn').disabled=false;
  document.getElementById('algo-status').textContent='點擊執行開始';
  setStatusDot('algo-dot','waiting');
  drawMaze([],null,MZ.view);
}

function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

document.getElementById('algo-speed').oninput=function(){
  const labels={1:'很慢',2:'慢',3:'中',4:'快',5:'極快'};
  document.getElementById('speed-label').textContent=labels[this.value];
};

document.addEventListener('keydown',e=>{
  if(MZ.view!=='player'||MZ.done)return;
  const keyMap={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],
    w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]};
  if(keyMap[e.key]){e.preventDefault();playerMove(...keyMap[e.key]);}
});
</script>
</body>
</html>
