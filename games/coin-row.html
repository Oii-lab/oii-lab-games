<style>
  .coin-arena{margin:20px 0;}
  .score-row{display:flex;justify-content:space-between;align-items:stretch;gap:12px;margin-bottom:16px;}
  .score-box{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;text-align:center;}
  .score-box.active{border-color:var(--accent);box-shadow:0 0 12px rgba(0,229,255,0.15);}
  .score-name{font-size:11px;color:var(--text-dim);letter-spacing:0.08em;margin-bottom:6px;}

  .score-coins{font-size:11px;color:var(--text-dim);margin-top:4px;min-height:16px;}
  .score-box.p2 .score-val{color:var(--accent2);}

  .coin-row-wrap{display:flex;align-items:center;gap:8px;justify-content:center;flex-wrap:nowrap;overflow-x:auto;padding:8px 0;}
  .take-btn{padding:10px 16px;border-radius:10px;border:2px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;font-weight:700;cursor:pointer;transition:all 0.18s;white-space:nowrap;flex-shrink:0;}

  .take-btn.left{border-radius:10px 4px 4px 10px;}

  .coin.highlight-right{box-shadow:0 0 0 3px var(--accent2),0 3px 10px rgba(255,64,129,0.4);}
  .coin-taken{opacity:0;width:0;margin:0;padding:0;border:none;overflow:hidden;transition:all 0.3s;}

  .dp-hint{text-align:center;font-size:12px;color:var(--text-dim);margin:8px 0;min-height:18px;}

<script>
function goHome(){
  document.getElementById('result-overlay').classList.remove('show');
  stopPolling();if(CUR.roomCode){cleanupRoom(CUR.roomCode);CUR.roomCode=null;}
  document.getElementById('crcreate-s1').classList.add('active');
  document.getElementById('crcreate-s2').classList.remove('active');
  CUR.game=null;showPanel('panel-setup');
}
function playAgain(){
  document.getElementById('result-overlay').classList.remove('show');
  stopPolling();if(CUR.roomCode){cleanupRoom(CUR.roomCode);CUR.roomCode=null;}
  if(CUR.lastSettings)_crStart(CUR.lastSettings);else goHome();
}

const CR={
  coins:[],left:0,right:0,
  score1:0,score2:0,taken1:[],taken2:[],
  currentPlayer:1,p1Name:'玩家',p2Name:'電腦',
  mode:null,myPlayer:1,cpuDiff:'hard',
  roomCode:null,lastSeen:0,gameOver:false
};

// DP table: dp[i][j] = max score current player can get from coins[i..j]
function crBuildDP(coins){
  const n=coins.length;
  const dp=Array.from({length:n},()=>Array(n).fill(0));
  for(let i=0;i<n;i++)dp[i][i]=coins[i];
  for(let len=2;len<=n;len++){
    for(let i=0;i<=n-len;i++){
      const j=i+len-1;
      const takeLeft=coins[i]+Math.min(
        len>=3?dp[i+2][j]:0,
        len>=2?dp[i+1][j-1]:0
      );
      const takeRight=coins[j]+Math.min(
        len>=2?dp[i+1][j-1]:0,
        len>=3?dp[i][j-2]:0
      );
      dp[i][j]=Math.max(takeLeft,takeRight);
    }
  }
  return dp;
}

function crOptimalMove(coins,left,right){
  if(left>right)return null;
  if(left===right)return'left';
  const dp=crBuildDP(coins.slice(left,right+1));
  const n=right-left+1;
  const takeLeft=coins[left]+( n>=3?Math.min(dp[2][n-1],dp[1][n-2]):n>=2?dp[1][n-1]:0 );
  const takeRight=coins[right]+( n>=2?Math.min(dp[0][n-3]??0,dp[1][n-2]):0 );

  // Recalculate cleanly
  const sub=coins.slice(left,right+1);
  const m=sub.length;
  const dpFull=crBuildDP(sub);
  let bestLeft=sub[0];
  if(m>=3)bestLeft+=Math.min(dpFull[2][m-1],dpFull[1][m-2]);
  else if(m>=2)bestLeft+=dpFull[1][m-1];

  let bestRight=sub[m-1];
  if(m>=3)bestRight+=Math.min(dpFull[1][m-2],dpFull[0][m-3]??0);
  else if(m>=2)bestRight+=dpFull[0][m-2];

  return bestLeft>=bestRight?'left':'right';
}

function crBeginCpu(){
  const n=+document.getElementById('cr-count').value;
  const coins=Array.from({length:n},()=>Math.floor(Math.random()*20)+1);
  _crStart({game:'coin-row',mode:'cpu',
    name:document.getElementById('cr-cpu-name').value.trim()||'玩家',
    coins,diff:document.getElementById('cr-cpu-diff').value,
    firstSel:document.getElementById('cr-cpu-first').value});
}

function _crStart(s){
  stopPolling();CUR.game='coin-row';CUR.lastSettings={...s,coins:[...s.coins]};
  CR.mode=s.mode;CR.coins=[...s.coins];CR.left=0;CR.right=s.coins.length-1;
  CR.score1=0;CR.score2=0;CR.taken1=[];CR.taken2=[];CR.cpuDiff=s.diff||'hard';
  CR.p1Name=s.name||s.hostName||'玩家';
  CR.p2Name=CR.mode==='cpu'?`電腦（${CR.cpuDiff==='hard'?'DP最優':'隨機走法'}）`:(s.guestName||'訪客');
  CR.myPlayer=s.myPlayer||1;CR.gameOver=false;CR.roomCode=s.roomCode||null;CR.lastSeen=0;
  CR.currentPlayer=s.firstPlayer||resolveFirst(s.firstSel||'player');
  _crInitUI();showPanel('panel-game');
  document.getElementById('cr-game-label').textContent='🪙 Coin Row'+(CR.mode!=='cpu'?(CR.myPlayer===1?' (房主)':' (訪客)'):'');
  if(CR.mode==='cpu'&&CR.currentPlayer===2){crUpdateStatus();setTimeout(crCpuTurn,900);}
  else crUpdateStatus();
  if(CR.mode!=='cpu'&&CR.currentPlayer!==CR.myPlayer)
    startRoomPolling(CR.roomCode,room=>{
      const mv=Object.values(room.moves||{});
      if(mv.length>CR.lastSeen){const m=mv[CR.lastSeen];CR.lastSeen=mv.length;stopPolling();crApplyMove(m.player,m.side,true);}
    });
}

function _crInitUI(){
  document.getElementById('cr-p1-name').textContent=CR.p1Name;
  document.getElementById('cr-p2-name').textContent=CR.p2Name;
  document.getElementById('cr-score-name1').textContent=CR.p1Name;
  document.getElementById('cr-score-name2').textContent=CR.p2Name;
  document.getElementById('cr-log').innerHTML='';
  addLog('cr-log','sys',`開始！${CR.coins.length}枚硬幣：[${CR.coins.join(', ')}]。輪流取左或右，總金額高者贏。`);
  crRenderCoins();crUpdateScore();crUpdateStatus();
}

function crRenderCoins(){
  const wrap=document.getElementById('cr-coins');wrap.innerHTML='';
  const isMyTurn=CR.mode==='cpu'?CR.currentPlayer===1:CR.currentPlayer===CR.myPlayer;
  const canAct=isMyTurn&&!CR.gameOver;

  for(let i=0;i<CR.coins.length;i++){
    const coin=document.createElement('div');
    if(i<CR.left||i>CR.right){
      coin.className='coin coin-taken';
    }else{
      coin.className='coin';
      if(i===CR.left&&canAct)coin.classList.add('highlight-left');
      if(i===CR.right&&canAct)coin.classList.add('highlight-right');
      if(CR.left===CR.right&&canAct){coin.classList.remove('highlight-right');coin.classList.add('highlight-left');}
    }
    coin.textContent=CR.coins[i];
    wrap.appendChild(coin);
  }

  const btnLeft=document.getElementById('cr-btn-left');
  const btnRight=document.getElementById('cr-btn-right');
  btnLeft.disabled=!canAct;
  btnRight.disabled=!canAct||CR.left===CR.right;

  // DP hint
  const hint=document.getElementById('cr-dp-hint');
  if(canAct&&CR.left<=CR.right){
    const sub=CR.coins.slice(CR.left,CR.right+1);
    const dp=crBuildDP(sub);
    const myBest=dp[0][sub.length-1];
    const total=sub.reduce((a,b)=>a+b,0);
    hint.textContent=`剩餘 ${sub.length} 枚，總值 ${total}。最優策略可讓你再拿到 ${myBest} 點。`;
  }else{
    hint.textContent='';
  }
}

function crUpdateScore(){
  document.getElementById('cr-score-val1').textContent=CR.score1;
  document.getElementById('cr-score-val2').textContent=CR.score2;
  document.getElementById('cr-score-coins1').textContent=CR.taken1.length?`已取：${CR.taken1.join(', ')}`:'';
  document.getElementById('cr-score-coins2').textContent=CR.taken2.length?`已取：${CR.taken2.join(', ')}`:'';

  const box1=document.getElementById('cr-score-p1');
  const box2=document.getElementById('cr-score-p2');
  const isMyTurn=CR.mode==='cpu'?CR.currentPlayer===1:CR.currentPlayer===CR.myPlayer;
  box1.classList.toggle('active',CR.currentPlayer===1&&!CR.gameOver);
  box2.classList.toggle('active',CR.currentPlayer===2&&!CR.gameOver);
}

function crUpdateStatus(){
  const isMyTurn=CR.mode==='cpu'?CR.currentPlayer===1:CR.currentPlayer===CR.myPlayer;
  updatePlayerTags('cr-p1-tag','cr-p2-tag',CR.currentPlayer);
  if(CR.gameOver){
    setStatusDot('cr-status-dot','over');
    document.getElementById('cr-status-text').textContent='遊戲結束';
    document.getElementById('cr-status-sub').textContent='';
    return;
  }
  if(isMyTurn){
    setStatusDot('cr-status-dot','your-turn');
    document.getElementById('cr-status-text').textContent='你的回合';
    document.getElementById('cr-status-sub').textContent='取左邊或右邊的硬幣';
  }else{
    setStatusDot('cr-status-dot','waiting');
    document.getElementById('cr-status-text').textContent=`${CR.currentPlayer===1?CR.p1Name:CR.p2Name} 的回合`;
    document.getElementById('cr-status-sub').textContent=CR.mode==='cpu'?'電腦計算中…':'等待對手…';
  }
  crRenderCoins();
}

async function crPlayerTake(side){
  if(CR.gameOver)return;
  if(CR.mode==='cpu'&&CR.currentPlayer!==1)return;
  if(CR.mode!=='cpu'&&CR.currentPlayer!==CR.myPlayer)return;
  if(CR.mode!=='cpu'){
    const _r=await getRoom(CR.roomCode);if(!_r)return;
    await pushMove(CR.roomCode,{player:CR.myPlayer,side});CR.lastSeen++;
  }
  crApplyMove(CR.myPlayer,side,true);
}

function crApplyMove(player,side,animate){
  const name=player===1?CR.p1Name:CR.p2Name;
  let val;
  if(side==='left'){
    val=CR.coins[CR.left];CR.left++;
  }else{
    val=CR.coins[CR.right];CR.right--;
  }

  if(player===1){CR.score1+=val;CR.taken1.push(val);}
  else{CR.score2+=val;CR.taken2.push(val);}

  addLog('cr-log',player===1?'p1':'p2',`${name} 取走${side==='left'?'左邊':'右邊'}的 ${val}`);
  crUpdateScore();

  // 結束判斷
  if(CR.left>CR.right){
    CR.gameOver=true;
    let winnerIdx,winner,loser;
    if(CR.score1>CR.score2){winnerIdx=1;winner=CR.p1Name;loser=CR.p2Name;}
    else if(CR.score2>CR.score1){winnerIdx=2;winner=CR.p2Name;loser=CR.p1Name;}
    else{winnerIdx=0;winner='';loser='';}

    crUpdateStatus();
    if(winnerIdx===0){
      addLog('cr-log','sys',`平局！雙方都是 ${CR.score1} 點。`);
      setTimeout(()=>{
        document.getElementById('result-emoji').textContent='🤝';
        document.getElementById('result-title').textContent='平局！';
        document.getElementById('result-title').style.color='var(--accent4)';
        document.getElementById('result-msg').textContent=`雙方都取得 ${CR.score1} 點，勢均力敵！`;
        document.getElementById('result-overlay').classList.add('show');
      },700);
    }else{
      addLog('cr-log','sys',`${winner} 獲勝！${CR.score1} vs ${CR.score2}`);
      const isMe=(CR.mode==='cpu'&&winnerIdx===1)||(CR.mode!=='cpu'&&winnerIdx===CR.myPlayer);
      setTimeout(()=>showResult(winnerIdx,winner,loser,isMe,`${winner} ${winnerIdx===1?CR.score1:CR.score2} 點 vs ${loser} ${winnerIdx===1?CR.score2:CR.score1} 點`),700);
    }
    return;
  }

  CR.currentPlayer=CR.currentPlayer===1?2:1;crUpdateStatus();
  if(CR.mode==='cpu'&&CR.currentPlayer===2)setTimeout(crCpuTurn,600+Math.random()*600);
  else if(CR.mode!=='cpu'&&CR.currentPlayer!==CR.myPlayer)
    startRoomPolling(CR.roomCode,room=>{
      const mv=Object.values(room.moves||{});
      if(mv.length>CR.lastSeen){const m=mv[CR.lastSeen];CR.lastSeen=mv.length;stopPolling();crApplyMove(m.player,m.side,true);}
    });
}

function crCpuTurn(){
  if(CR.gameOver)return;
  let side;
  if(CR.cpuDiff==='easy'&&Math.random()<0.75){
    side=Math.random()<0.5?'left':'right';
  }else{
    side=crOptimalMove(CR.coins,CR.left,CR.right)||'left';
  }
  setTimeout(()=>crApplyMove(2,side,true),200);
}

async function crCreateRoom(){
  const n=+document.getElementById('cr-room-count').value;
  const coins=Array.from({length:n},()=>Math.floor(Math.random()*20)+1);
  const hostName=document.getElementById('cr-host-name').value.trim()||'房主';
  const firstPlayer=resolveFirst(document.getElementById('cr-room-first').value);
  const code=await uniqueCode();
  await setRoom(code,{code,game:'coin-row',hostName,coins,firstPlayer,guest:false,guestName:null,started:false,moves:[],created:Date.now()});
  CUR.roomCode=code;CR.roomCode=code;
  document.getElementById('cr-room-code-display').textContent=code;
  registerHostDisconnect(code);
  document.getElementById('crcreate-s1').classList.remove('active');
  document.getElementById('crcreate-s2').classList.add('active');
  startRoomPolling(code,room=>{
    if(room.guest){stopPolling();_crStart({game:'coin-row',mode:'host',hostName,guestName:room.guestName,coins,myPlayer:1,roomCode:code,firstPlayer});}
  });
}
async function crCancelRoom(){
  stopPolling();if(CUR.roomCode){cleanupRoom(CUR.roomCode);CUR.roomCode=null;}
  document.getElementById('crcreate-s1').classList.add('active');
  document.getElementById('crcreate-s2').classList.remove('active');
}
async function crJoinRoom(){
  const guestName=document.getElementById('cr-guest-name').value.trim()||'訪客';
  const code=document.getElementById('cr-join-code').value.trim().toUpperCase();
  const err=document.getElementById('cr-join-err');err.style.display='none';
  if(code.length!==4){err.textContent='請輸入4位代碼';err.style.display='block';return;}
  const room=await getRoom(code);
  if(!room||room.game!=='coin-row'){err.textContent='找不到此硬幣房間';err.style.display='block';return;}
  if(room.guest||room.started){err.textContent='房間已滿';err.style.display='block';return;}
  await updateRoom(code,{guest:true,guestName,started:true});CUR.roomCode=code;
  _crStart({game:'coin-row',mode:'guest',hostName:room.hostName,guestName,name:guestName,coins:[...room.coins],myPlayer:2,roomCode:code,firstPlayer:room.firstPlayer});
}
