<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>21點報數 — 演算法互動遊戲集</title>
<link rel="stylesheet" href="../shared/style.css">
</head>
<body>
<canvas id="confetti-canvas"></canvas>
<div class="container">

<header>
  <div class="title">🔢 21點報數</div>
  <div class="subtitle">報數遊戲 &nbsp;·&nbsp; Dynamic Programming &nbsp;·&nbsp; O(1) Strategy</div>
</header>

<div style="text-align:center;margin-bottom:20px">
  <a href="../index.html" style="font-size:12px;color:var(--text-dim);text-decoration:none;letter-spacing:0.1em;text-transform:uppercase;
    padding:8px 14px;border:1px solid var(--border);border-radius:8px;transition:all 0.2s;display:inline-block;"
    onmouseover="this.style.color='var(--accent)';this.style.borderColor='var(--accent)'"
    onmouseout="this.style.color='var(--text-dim)';this.style.borderColor='var(--border)'">← 返回選單</a>
</div>

<!-- 遊戲規則 -->
<div class="rules-block">
  <div class="rules-title">📖 遊戲規則</div>
  <div class="rules-body">
    <div class="rules-item move">
      <div class="ri-label">每回合</div>
      <div class="ri-text">從目前數字開始，<strong>接著報 1 到 M 個</strong>連續數字</div>
    </div>
    <div class="rules-item lose">
      <div class="ri-label">輸的條件</div>
      <div class="ri-text">說出<strong>目標數字</strong>（如 21）的人輸</div>
    </div>
    <div class="rules-item tip">
      <div class="ri-label">挑戰</div>
      <div class="ri-text">先玩幾局，看看你能不能找出必輸的節奏 👇</div>
    </div>
  </div>
</div>

<!-- 設定 -->
<div class="panel active" id="panel-setup">
  <div class="panel-title">⚙️ 遊戲設定</div>
  <div class="mode-tabs">
    <div class="mode-tab active" id="ctab-cpu" onclick="setModeTab('c','cpu')">🖥️ 單人對戰（電腦）</div>
    <div class="mode-tab" id="ctab-create" onclick="setModeTab('c','create')">🏠 開房間</div>
    <div class="mode-tab" id="ctab-join" onclick="setModeTab('c','join')">🔗 加入房間</div>
  </div>
  <div id="cmode-cpu">
    <div class="input-group"><label>你的名稱</label><input id="c-cpu-name" placeholder="玩家" maxlength="16"></div>
    <div class="input-group"><label>目標數字</label>
      <select id="c-target"><option value="21" selected>21（經典）</option><option value="31">31</option><option value="50">50</option></select></div>
    <div class="input-group"><label>每次最多報幾個（M）</label>
      <select id="c-max-say"><option value="2" selected>最多2個（經典）</option><option value="3">最多3個</option></select></div>
    <div class="input-group"><label>電腦難度</label>
      <select id="c-cpu-diff"><option value="easy">😊 簡單（偶爾隨機走）</option><option value="hard" selected>😈 困難（最優演算法）</option></select></div>
    <div class="input-group"><label>先手</label>
      <select id="c-cpu-first"><option value="player">玩家先手</option><option value="cpu">電腦先手</option><option value="random">隨機</option></select></div>
    <div class="btn-row">
      <button class="btn btn-primary btn-lg" onclick="count21BeginCpu()">🚀 開始遊戲</button>
    </div>
  </div>
  <div id="cmode-create" style="display:none">
    <div class="step active" id="ccreate-s1">
      <div class="input-group"><label>你的名稱</label><input id="c-host-name" placeholder="房主" maxlength="16"></div>
      <div class="input-group"><label>目標數字</label>
        <select id="c-room-target"><option value="21" selected>21</option><option value="31">31</option><option value="50">50</option></select></div>
      <div class="input-group"><label>每次最多報幾個</label>
        <select id="c-room-max"><option value="2" selected>最多2個</option><option value="3">最多3個</option></select></div>
      <div class="input-group"><label>先手</label>
        <select id="c-room-first"><option value="host">房主先手</option><option value="guest">訪客先手</option><option value="random">隨機</option></select></div>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="count21CreateRoom()">🏠 建立房間</button>
      </div>
    </div>
    <div class="step" id="ccreate-s2">
      <div class="room-code-box"><div class="code-label">房間代碼</div><div class="code-val" id="c-room-code-display">----</div><div class="code-hint">分享給朋友</div></div>
      <div class="status-bar" style="margin-top:8px"><span class="spinner"></span><span class="status-text">等待對手加入…</span></div>
      <div class="btn-row">
        <button class="btn btn-outline btn-sm" onclick="copyCode('c-room-code-display')">📋 複製</button>
        <button class="btn btn-sm" onclick="count21CancelRoom()">❌ 取消</button>
      </div>
    </div>
  </div>
  <div id="cmode-join" style="display:none">
    <div class="input-group"><label>你的名稱</label><input id="c-guest-name" placeholder="玩家" maxlength="16"></div>
    <div class="input-group"><label>房間代碼</label>
      <input id="c-join-code" placeholder="XXXX" maxlength="4" style="letter-spacing:0.3em;font-family:'Orbitron',monospace;font-size:20px;" oninput="this.value=this.value.toUpperCase()"></div>
    <div id="c-join-err" style="color:var(--accent2);font-size:12px;display:none;margin-bottom:8px;"></div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="count21JoinRoom()">🔗 加入</button>
    </div>
  </div>
</div>

<!-- 遊戲 -->
<div class="panel" id="panel-game">
  <div class="panel-title" id="count21-game-label">🔢 21點報數</div>
  <div class="players-row">
    <div class="player-tag" id="c-p1-tag"><div class="p-name" id="c-p1-name">—</div><div class="p-label">玩家1</div></div>
    <div style="display:flex;align-items:center;color:var(--text-dim);font-size:11px;font-family:'Orbitron',monospace;">VS</div>
    <div class="player-tag" id="c-p2-tag"><div class="p-name" id="c-p2-name">—</div><div class="p-label">玩家2</div></div>
  </div>
  <div class="status-bar">
    <div class="status-dot" id="c-status-dot"></div>
    <div style="flex:1"><div class="status-text" id="c-status-text">準備中</div><div class="status-sub" id="c-status-sub"></div></div>
  </div>
  <div class="count-track" id="c-track"></div>
  <div class="count-display"><div class="count-big" id="c-count">0</div><div class="count-label">目前數到</div></div>
  <div class="say-btns" id="c-say-btns"></div>
  <div class="game-log" id="c-log"></div>
  <div class="btn-row" style="margin-top:14px">
    <button class="btn btn-sm" onclick="goHome()">⚙️ 重新設定</button>
  </div>
</div>

<!-- 演算法解析連結 -->
<div style="text-align:center;margin:24px 0 8px;">
  <a href="count21-algo.html"
    style="display:inline-flex;align-items:center;gap:10px;padding:14px 28px;
      background:var(--surface);border:1px solid var(--border);border-radius:12px;
      text-decoration:none;color:var(--text);font-size:14px;transition:all 0.2s;letter-spacing:0.03em;"
    onmouseover="this.style.borderColor='var(--accent)';this.style.color='var(--accent)'"
    onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--text)'">
    🧠 <strong>看演算法解析</strong> &nbsp;— 為什麼和 Bachet 一樣？DP 對應關係完整說明
  </a>
</div>

</div>

<div id="disconnect-overlay" style="display:none;position:fixed;inset:0;background:rgba(10,10,15,0.92);
  z-index:150;backdrop-filter:blur(6px);align-items:center;justify-content:center;">
  <div style="background:var(--surface);border:1px solid var(--accent2);border-radius:20px;padding:36px;
    text-align:center;max-width:320px;width:90%;">
    <div style="font-size:48px;margin-bottom:12px;">😔</div>
    <div style="font-family:'Orbitron',monospace;font-size:16px;font-weight:900;color:var(--accent2);margin-bottom:10px;">對手已離開</div>
    <div style="font-size:13px;color:var(--text-dim);margin-bottom:24px;line-height:1.7;">房間已關閉。</div>
    <button class="btn btn-primary" onclick="dismissDisconnect()" style="width:100%">⚙️ 回設定</button>
  </div>
</div>
<div class="result-overlay" id="result-overlay">
  <div class="result-box">
    <span class="result-emoji" id="result-emoji">🏆</span>
    <div class="result-title" id="result-title">勝利！</div>
    <div class="result-msg" id="result-msg"></div>
    <div class="btn-row" style="justify-content:center">
      <button class="btn btn-primary" onclick="playAgain()">🔄 再玩一局</button>
      <button class="btn btn-outline" onclick="goHome()">⚙️ 重新設定</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="../shared/firebase.js"></script>
<script src="../shared/ui.js"></script>
<script>
function goHome(){
  document.getElementById('result-overlay').classList.remove('show');
  stopPolling();if(CUR.roomCode){cleanupRoom(CUR.roomCode);CUR.roomCode=null;}
  document.getElementById('ccreate-s1').classList.add('active');document.getElementById('ccreate-s2').classList.remove('active');
  CUR.game=null;showPanel('panel-setup');
}
function playAgain(){
  document.getElementById('result-overlay').classList.remove('show');
  stopPolling();if(CUR.roomCode){cleanupRoom(CUR.roomCode);CUR.roomCode=null;}
  if(CUR.lastSettings)_count21Start(CUR.lastSettings);else goHome();
}
const C={current:0,target:21,maxSay:2,currentPlayer:1,p1Name:'玩家',p2Name:'電腦',mode:null,myPlayer:1,cpuDiff:'hard',roomCode:null,lastSeen:0,gameOver:false};
function count21BeginCpu(){_count21Start({game:'count21',mode:'cpu',name:document.getElementById('c-cpu-name').value.trim()||'玩家',target:+document.getElementById('c-target').value,maxSay:+document.getElementById('c-max-say').value,diff:document.getElementById('c-cpu-diff').value,firstSel:document.getElementById('c-cpu-first').value});}
function _count21Start(s){
  stopPolling();CUR.game='count21';CUR.lastSettings=s;
  C.mode=s.mode;C.target=s.target;C.maxSay=s.maxSay;C.cpuDiff=s.diff||'hard';
  C.p1Name=s.name||s.hostName||'玩家';C.p2Name=C.mode==='cpu'?`電腦（${C.cpuDiff==='hard'?'最優演算法':'隨機走法'}）`:(s.guestName||'訪客');
  C.myPlayer=s.myPlayer||1;C.gameOver=false;C.roomCode=s.roomCode||null;C.current=0;C.lastSeen=0;
  C.currentPlayer=s.firstPlayer||resolveFirst(s.firstSel||'player');
  _count21InitUI();showPanel('panel-game');
  document.getElementById('count21-game-label').textContent=`🔢 21點報數（目標:${C.target}）`;
  if(C.mode==='cpu'&&C.currentPlayer===2){cUpdateStatus();setTimeout(cCpuTurn,900);}else cUpdateStatus();
  if(C.mode!=='cpu'&&C.currentPlayer!==C.myPlayer)startRoomPolling(C.roomCode,room=>{const mv=Object.values(room.moves||{});if(mv.length>C.lastSeen){const m=mv[C.lastSeen];C.lastSeen=mv.length;stopPolling();cApplyMove(m.player,m.nums,true);}});
}
function _count21InitUI(){
  document.getElementById('c-p1-name').textContent=C.p1Name;document.getElementById('c-p2-name').textContent=C.p2Name;
  document.getElementById('c-log').innerHTML='';document.getElementById('c-track').innerHTML='';document.getElementById('c-count').textContent='0';
  cBuildSayBtns();addLog('c-log','sys',`開始！從1報到${C.target}，每次報1~${C.maxSay}個。說到${C.target}者輸。`);cUpdateStatus();
}
function cBuildSayBtns(){
  const c=document.getElementById('c-say-btns');c.innerHTML='';
  for(let i=1;i<=C.maxSay;i++){const btn=document.createElement('button');btn.className='say-btn';btn.id='csay-'+i;const nums=Array.from({length:i},(_,j)=>C.current+j+1);btn.innerHTML=`${nums.join(',')}<span class="lbl">報${i}個</span>`;btn.onclick=()=>cPlayerSay(i);c.appendChild(btn);}
}
function cUpdateStatus(){
  const isMyTurn=C.mode==='cpu'?C.currentPlayer===1:C.currentPlayer===C.myPlayer;
  updatePlayerTags('c-p1-tag','c-p2-tag',C.currentPlayer);
  if(C.gameOver){setStatusDot('c-status-dot','over');document.getElementById('c-status-text').textContent='遊戲結束';document.getElementById('c-status-sub').textContent='';cSetBtns(false);return;}
  cBuildSayBtns();
  if(isMyTurn){
    setStatusDot('c-status-dot','your-turn');document.getElementById('c-status-text').textContent='你的回合';
    document.getElementById('c-status-sub').textContent=`目前${C.current}，可報${C.current+1}${C.maxSay>1?`~${Math.min(C.current+C.maxSay,C.target)}`:''}`;
    cSetBtns(true);
    for(let i=1;i<=C.maxSay;i++){const btn=document.getElementById('csay-'+i);if(btn)btn.disabled=C.current+i>C.target;}
  }else{
    setStatusDot('c-status-dot','waiting');document.getElementById('c-status-text').textContent=`${C.currentPlayer===1?C.p1Name:C.p2Name} 的回合`;
    document.getElementById('c-status-sub').textContent=C.mode==='cpu'?'電腦計算中…':'等待對手…';cSetBtns(false);
  }
}
function cSetBtns(e){for(let i=1;i<=C.maxSay;i++){const b=document.getElementById('csay-'+i);if(b)b.disabled=!e;}}
async function cPlayerSay(count){
  if(C.gameOver)return;if(C.mode==='cpu'&&C.currentPlayer!==1)return;if(C.mode!=='cpu'&&C.currentPlayer!==C.myPlayer)return;
  const nums=Array.from({length:count},(_,i)=>C.current+i+1);if(nums[nums.length-1]>C.target)return;
  if(C.mode!=='cpu'){const _r=await getRoom(C.roomCode);if(!_r)return;await pushMove(C.roomCode,{player:C.myPlayer,nums});C.lastSeen++;}
  cApplyMove(C.myPlayer,nums,true);
}
function cApplyMove(player,nums,animate){
  const name=player===1?C.p1Name:C.p2Name;addLog('c-log',player===1?'p1':'p2',`${name} 報了 ${nums.join(', ')}`);
  const track=document.getElementById('c-track');
  nums.forEach(n=>{const el=document.createElement('div');el.className='track-num '+(player===1?'p1':'p2');el.textContent=n;if(n===C.target)el.classList.add('target');track.appendChild(el);});
  C.current=nums[nums.length-1];document.getElementById('c-count').textContent=C.current;
  if(C.current===C.target){
    C.gameOver=true;const loser=name,winnerIdx=player===1?2:1,winner=winnerIdx===1?C.p1Name:C.p2Name;
    cUpdateStatus();addLog('c-log','sys',`${loser}說到了${C.target}！${winner}獲勝🎉`);
    const isMe=(C.mode==='cpu'&&winnerIdx===1)||(C.mode!=='cpu'&&winnerIdx===C.myPlayer);
    setTimeout(()=>showResult(winnerIdx,winner,loser,isMe,`${loser}說到了${C.target}。`),700);return;
  }
  C.currentPlayer=C.currentPlayer===1?2:1;cUpdateStatus();
  if(C.mode==='cpu'&&C.currentPlayer===2)setTimeout(cCpuTurn,600+Math.random()*600);
  else if(C.mode!=='cpu'&&C.currentPlayer!==C.myPlayer)startRoomPolling(C.roomCode,room=>{const mv=Object.values(room.moves||{});if(mv.length>C.lastSeen){const m=mv[C.lastSeen];C.lastSeen=mv.length;stopPolling();cApplyMove(m.player,m.nums,true);}});
}
function cCpuTurn(){if(C.gameOver)return;setTimeout(()=>cApplyMove(2,cCalcMove(),true),250);}
function cCalcMove(){
  const k=C.maxSay+1,t=C.target,cur=C.current;
  if(C.cpuDiff==='easy'){
    if(Math.random()<0.25)return cOptimal(k,t,cur);
    const max=Math.min(C.maxSay,t-cur);const cnt=Math.floor(Math.random()*max)+1;return Array.from({length:cnt},(_,i)=>cur+i+1);
  }
  return cOptimal(k,t,cur);
}
function cOptimal(k,t,cur){const remaining=t-cur;if(remaining%k===0)return[cur+1];const cnt=Math.min(remaining%k,C.maxSay);return Array.from({length:cnt||1},(_,i)=>cur+i+1);}
async function count21CreateRoom(){
  const hostName=document.getElementById('c-host-name').value.trim()||'房主';const target=+document.getElementById('c-room-target').value;const maxSay=+document.getElementById('c-room-max').value;const firstPlayer=resolveFirst(document.getElementById('c-room-first').value);
  const code=await uniqueCode();await setRoom(code,{code,game:'count21',hostName,target,maxSay,firstPlayer,guest:false,guestName:null,started:false,moves:[],created:Date.now()});
  CUR.roomCode=code;C.roomCode=code;document.getElementById('c-room-code-display').textContent=code;registerHostDisconnect(code);
  document.getElementById('ccreate-s1').classList.remove('active');document.getElementById('ccreate-s2').classList.add('active');
  startRoomPolling(code,room=>{if(room.guest){stopPolling();_count21Start({game:'count21',mode:'host',hostName,guestName:room.guestName,target,maxSay,myPlayer:1,roomCode:code,firstPlayer});}});
}
async function count21CancelRoom(){stopPolling();if(CUR.roomCode){cleanupRoom(CUR.roomCode);CUR.roomCode=null;}document.getElementById('ccreate-s1').classList.add('active');document.getElementById('ccreate-s2').classList.remove('active');}
async function count21JoinRoom(){
  const guestName=document.getElementById('c-guest-name').value.trim()||'訪客';const code=document.getElementById('c-join-code').value.trim().toUpperCase();
  const err=document.getElementById('c-join-err');err.style.display='none';
  if(code.length!==4){err.textContent='請輸入4位代碼';err.style.display='block';return;}
  const room=await getRoom(code);if(!room||room.game!=='count21'){err.textContent='找不到此21點房間';err.style.display='block';return;}
  if(room.guest||room.started){err.textContent='房間已滿';err.style.display='block';return;}
  await updateRoom(code,{guest:true,guestName,started:true});CUR.roomCode=code;
  _count21Start({game:'count21',mode:'guest',hostName:room.hostName,guestName,name:guestName,target:room.target,maxSay:room.maxSay,myPlayer:2,roomCode:code,firstPlayer:room.firstPlayer});
}
</script>
</body>
</html>
